# Generated from app/src/main/res/values/strings.xml; Mac-specific wording overrides a few keys.
NO_KEY=大脑还没配 API key。打开「设置」（窗口右上角的 ⚙，或菜单栏 Andee → 设置），在「后端」里填上 Key。
NO_RESULT=我这轮没拿到结果，你再说一遍试试。
REPEAT_STOP=我一直在重复同一个动作（%1$s），停下来了 —— 这条路走不通，换个说法或者你来操作一下。
MAX_STEPS=这件事我做了 %1$d 步还没办完，先停下来问你一句：要不要换个路子，或者你来接手？
ERROR=我这边出错了：%1$s
ERROR_400=后端说请求有问题：%1$s\n最常见的原因是模型名写错了，到「设置」→「后端」核对一下模型名。
ERROR_402=后端服务返回了 402，多半是账户余额不足了。到「设置」→「后端」看看当前用的是哪家服务商，打开它的官网充值后再试。
ERROR_402_CODEFLYING=后端服务返回了 402，多半是 CodeFlying 账户余额不足了。用电脑浏览器打开 CodeFlying.net 登录后充值，再试一次。
ERROR_404=后端找不到这个地址（HTTP 404）。到「设置」→「后端」检查接口地址和模型名有没有填错。
ERROR_429=后端现在太忙或者请求太频繁了（HTTP 429），过一会儿再说一遍就行。如果一直这样，去服务商官网看看额度有没有用完。
ERROR_5XX=后端服务自己出了问题（HTTP %1$d），不是你这边的设置有误。过几分钟再试；一直不行就去服务商官网看看是否在维护。
ERROR_AUTH=后端拒绝了请求（HTTP %1$d）：Key 填错、过期或被停用了。到「设置」→「后端」检查 Key，必要时去服务商官网重新生成一个。
ERROR_TIMEOUT=后端半天没有回应。先看看网络通不通，稍后再试一次。
ERROR_NETWORK=连不上后端服务。检查一下这台设备的网络；如果网络没问题，到「设置」→「后端」核对接口地址。
NARRATE_GET_SCREEN=读一下屏幕…
