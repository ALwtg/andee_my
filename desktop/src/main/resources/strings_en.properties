# Generated from app/src/main/res/values-en/strings.xml; Mac-specific wording overrides a few keys.
NO_KEY=The brain has no API key yet. Open Settings (⚙ at the top right of the window, or Andee → Settings in the menu bar) and put the key under Backend.
NO_RESULT=I got nothing back that time — say it again.
REPEAT_STOP=I kept doing the same thing over and over (%1$s), so I stopped — that way is blocked. Try saying it differently, or take over.
MAX_STEPS=I have spent %1$d steps on this without finishing, so I stopped to ask: shall I try another way, or will you take over?
ERROR=Something broke on my side: %1$s
ERROR_400=The backend rejected the request: %1$s\nThe usual cause is a misspelled model name. Check it in Settings → Backend.
ERROR_402=The backend answered 402, which most likely means the account is out of balance. Open Settings → Backend to see which provider you are using, then top up on that provider's website and try again.
ERROR_402_CODEFLYING=The backend answered 402, which most likely means your CodeFlying balance has run out. Open CodeFlying.app in a computer browser, sign in, top up, and try again.
ERROR_404=The backend could not find that address (HTTP 404). Check the endpoint URL and the model name in Settings → Backend.
ERROR_429=The backend is busy or being asked too often (HTTP 429). Say it again in a moment. If it keeps happening, check on the provider's website whether your quota has run out.
ERROR_5XX=The backend itself is having trouble (HTTP %1$d). Your settings are not the problem. Try again in a few minutes, or check the provider's website for maintenance notices.
ERROR_AUTH=The backend refused the request (HTTP %1$d): the key is wrong, expired or disabled. Check the key in Settings → Backend, and generate a new one on the provider's website if needed.
ERROR_TIMEOUT=The backend took too long to answer. Check that the network is working and try again in a moment.
ERROR_NETWORK=I could not reach the backend. Check this device's network; if that is fine, check the endpoint URL in Settings → Backend.
