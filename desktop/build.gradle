// The macOS app: the shared brain from :core, a Compose Desktop window, and
// the Mac body (screen, voice, shell) as it is built up. Packaged with
// `./gradlew :desktop:createDistributable` into
// desktop/build/compose/binaries/main/app/Andee.app.
import org.jetbrains.compose.desktop.application.dsl.TargetFormat

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.compose'
}

kotlin {
    jvmToolchain(17)
}

// Native helpers, compiled with the Command Line Tools' swiftc (arm64).
def nativeOut = layout.buildDirectory.dir('native')
tasks.register('buildTrashTool', Exec) {
    def src = file('native/trash.swift')
    def out = nativeOut.get().file('andee-trash').asFile
    inputs.file(src)
    outputs.file(out)
    doFirst { out.parentFile.mkdirs() }
    commandLine 'swiftc', '-O', '-target', 'arm64-apple-macos14', src.path, '-o', out.path
}
// The bridge JNA loads: accessibility tree, input events, ScreenCaptureKit, workspace.
tasks.register('buildBridge', Exec) {
    def src = file('native/AndeeMac.swift')
    def out = nativeOut.get().file('libandeemac.dylib').asFile
    inputs.file(src)
    outputs.file(out)
    doFirst { out.parentFile.mkdirs() }
    commandLine 'swiftc', '-O', '-target', 'arm64-apple-macos14', '-emit-library', src.path, '-o', out.path
}
tasks.register('buildNative') { dependsOn('buildTrashTool', 'buildBridge') }
sourceSets.main.resources.srcDir(nativeOut)
processResources.dependsOn('buildNative')

dependencies {
    implementation project(':core')
    implementation compose.desktop.currentOs
    // Android has org.json built in; a JVM app has to bring it.
    implementation 'org.json:json:20240303'
    // Calls into native/AndeeMac.swift.
    implementation 'net.java.dev.jna:jna:5.14.0'

    testImplementation libs.junit
}

compose.desktop {
    application {
        mainClass = 'net.kuafuai.andee.desktop.MainKt'
        nativeDistributions {
            targetFormats(TargetFormat.Dmg)
            packageName = 'Andee'
            // macOS rejects a 0.x bundle version for a .dmg; 1.0.0 is the bundle's
            // version, not the product's.
            packageVersion = '1.0.0'
            macOS {
                bundleID = 'net.kuafuai.andee.mac'
                entitlementsFile.set(project.file('entitlements.plist'))
                runtimeEntitlementsFile.set(project.file('entitlements.plist'))
                // macOS shows these when Andee first asks; without them the request is refused silently.
                infoPlist {
                    extraKeysRawXml = '''
                        <key>NSMicrophoneUsageDescription</key>
                        <string>Andee listens when you press the microphone button, to hear what you ask.</string>
                        <key>NSAppleEventsUsageDescription</key>
                        <string>Andee uses Calendar, Reminders, Contacts and other apps when you ask it to.</string>
                        <key>NSCalendarsUsageDescription</key>
                        <string>Andee reads and adds calendar events when you ask it to.</string>
                        <key>NSRemindersUsageDescription</key>
                        <string>Andee sets reminders when you ask it to.</string>
                        <key>NSContactsUsageDescription</key>
                        <string>Andee looks up contacts when you ask it to.</string>
                        <key>NSCameraUsageDescription</key>
                        <string>Andee looks through the camera only when you ask it to.</string>
                    '''
                }
            }
        }
    }
}

// A turn without the window, for checking the brain on this Mac:
//   ./gradlew :desktop:probe --args='记住我喜欢芒果'
tasks.register('probe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.kuafuai.andee.desktop.ProbeKt'
    standardInput = System.in
}

tasks.named('test') {
    dependsOn('buildNative')
    systemProperty 'andee.trashTool', layout.buildDirectory.file('native/andee-trash').get().asFile.path
}
