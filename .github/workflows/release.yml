# Builds *signed* release APKs.
#
# This is a separate workflow from build.yml on purpose. build.yml's debug job
# needs no secrets and must keep passing on every fork; a release job that
# fails for want of secrets its runner cannot have would make the repo look
# broken to anyone who just cloned it. This one runs only when asked:
# `workflow_dispatch`, or a `v*` tag.
#
# The keystore is not in this repository — a signature is the only thing
# standing between a user and an APK that installs over this one and inherits
# everything it can read, and a leaked one cannot be revoked. It travels as a
# base64 secret, is written to the runner's temp dir for the duration of the
# build, and is deleted again in the final step regardless of outcome.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64      base64 of the .keystore / .jks file
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS            key alias
#   ANDROID_KEY_PASSWORD         key password (falls back to the store password
#                                if unset — see signingProp in app/build.gradle)
#
# The JDK is pinned to 17 for the same reason as in build.yml: AGP 8.3.1 needs
# 17 or newer, and the Gradle 8.4 wrapper cannot run on 21 or newer.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the four signing secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/andee.keystore"

      - name: Assemble signed release
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/andee.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # One APK per ABI — `universalApk false` in app/build.gradle — so the
      # glob is deliberate, not a single app-release.apk.
      - name: Verify signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | head -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "── $apk"
            "$apksigner" verify --print-certs "$apk" | grep -E '^(Verifies|Signer #)' || {
              echo "::error::$apk is not properly signed"
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --generate-notes --title "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" app/build/outputs/apk/release/*.apk --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/andee.keystore"
